# JAGS_EXTRA_CPPFLAGS = "-I/Users/langmm/YggInterface/_install/include/YggInterface -I$CONDA_PREFIX/include/python3.12 -I$CONDA_PREFIX/lib/python3.12/site-packages/numpy/_core/include"
