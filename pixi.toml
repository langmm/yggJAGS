[workspace]
name = "jags"
version = "4.3.2"
description = "JAGS (Just Another Gibbs Sampler) with an optional Yggdrasil interface module"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
# autotools build toolchain
autoconf = ">=2.71"
automake = "*"
bison = "*"
flex = "*"
libtool = "*"
m4 = "*"
make = "*"
gnuconfig = "*"
pkg-config = "*"
bash = "*"
# conda compiler toolchain (sets CC/CXX via activation scripts, gfortran on PATH)
compilers = "*"
# linear algebra required by configure (AX_LAPACK)
blas = "*"
lapack = "*"
# unit test framework used by `make check`
cppunit = "*"
# runtime / integration dependencies (mirrors environment.yml)
python = "*"
r-base = "*"
r-rjags = "*"
jags = "*"

[environments]
# default: plain JAGS build/test
# ygg:    build/test against the locally installed YggInterface library
default = []
ygg = ["ygg"]

[tasks]
autogen = { cmd = """
libtoolize --copy --force &&
aclocal &&
autoconf &&
autoheader &&
automake --add-missing --force-missing &&
/bin/cp -f \"$CONDA_PREFIX/share/gnuconfig/config.guess\" config.guess &&
/bin/cp -f \"$CONDA_PREFIX/share/gnuconfig/config.sub\" config.sub
""", description = "Bootstrap the autotools build system (libtoolize, aclocal, autoconf, autoheader, automake)" }

# In the `ygg` environment this also passes --with-ygginterface, points
# pkg-config at the local YggInterface install, adds its headers to the
# include path (the YggInterface.pc file only has relative paths for them),
# and embeds an rpath so test executables resolve libYggInterface without
# DYLD_/LD_LIBRARY_PATH.
configure = { cmd = """
CPPFLAGS=\"$CPPFLAGS $JAGS_EXTRA_CPPFLAGS\" &&
LDFLAGS=\"$LDFLAGS $JAGS_EXTRA_LDFLAGS\" &&
./configure --prefix=\"$CONDA_PREFIX\" $JAGS_CONFIGURE_FLAGS
""", depends-on = ["autogen"], description = "Configure JAGS (with YggInterface support when run with -e ygg)" }

build = { cmd = "make -j$(sysctl -n hw.ncpu 2>/dev/null || nproc)", depends-on = ["configure"], description = "Compile JAGS in parallel" }

test = { cmd = "make check", depends-on = ["build"], description = "Build and run the cppunit test suites (base, bugs, mix, glm, ygg)" }

install = { cmd = "make install", depends-on = ["build"], description = "Install JAGS into the active pixi environment prefix" }

clean = { cmd = "make clean", description = "Remove build artifacts (object files, libraries)" }

distclean = { cmd = "make distclean", description = "Remove all files generated by configure and make" }

# YggInterface is not available from conda; these settings point the build at
# a local install (e.g. built with the YggInterface build scripts into _install).
# The runtime libraries that libYggInterface depends on (libpython3.12,
# libzmq, libcurl, libomp) are provided by this environment instead and
# resolved via the rpath that the conda compiler activation embeds.
[feature.ygg.dependencies]
git = "*"
python = ">=3.11"
numpy = "*"
cmake = "*"
ninja = "*"
pkg-config = "*"
yggdrasil-rapidjson = "*"
libcurl = "*"
zeromq = "*"
openmpi = "*"
jinja2 = "*"
pyyaml = "*"
flask = "*"

[feature.ygg.target.unix.dependencies]
sysv_ipc = "*"

[feature.ygg.target.osx.dependencies]
llvm-openmp = "*"

[feature.ygg.tasks]
clone-ygg = {
    description = "Clone YggInterface if it dosn't exist",
    cmd = "[ -d $YGG_ROOT ] && echo 'YggInterface exists' || git clone https://github.com/langmm/YggInterface.git $YGG_ROOT",
}
configure-ygg = {
    description = "Configure YggInterface",
    cmd = "cmake -S $YGG_ROOT -B build_ygginterface -G Ninja -DYGG_DEBUG_LEVEL=20",
    depends-on = ["clone-ygg"],
}
build-ygg = {
    description = "Build YggInterface",
    cmd = "cmake --build build_ygginterface -j{{ nproc }}",
    depends-on = ["configure-ygg"],
    args = [
        { arg = "nproc", default = "8" },
    ],
}
install-ygg = {
    description = "Install YggInterface in the pixi environment",
    cmd = "cmake --install build_ygginterface --prefix $CONDA_PREFIX",
    depends-on = ["build-ygg"],
}

[feature.ygg.activation.env]
YGG_ROOT = "/Users/langmm/YggInterface"
JAGS_CONFIGURE_FLAGS = "--with-ygginterface"
